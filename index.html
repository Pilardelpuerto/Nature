<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nature</title>
  <meta property="og:title" content="Connect with nature">
  <meta property="og:description" content="A work by Pilar del Puerto">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://callingnature.xyz">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%2300b140'/></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #00b140;
      color: #fff;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      overflow: hidden;
      position: relative;
    }

    #centro {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      padding: 0 2rem;
    }

    #label {
      font-size: clamp(11px, 3vw, 14px);
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.9);
      text-transform: lowercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      height: clamp(28px, 6vw, 36px);
      display: flex;
      align-items: center;
    }

    #name {
      font-size: clamp(34px, 9.6vw, 50px);
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.3);
      height: clamp(50px, 13vw, 68px);
      display: flex;
      align-items: center;
    }

    #zona-estado {
      height: clamp(48px, 10vw, 64px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    #connecting {
      font-size: clamp(11px, 3vw, 14px);
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.1em;
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      visibility: hidden;
    }

    #timer {
      font-size: clamp(13px, 3.5vw, 16px);
      color: rgba(255,255,255,0.9);
      letter-spacing: 0.15em;
      font-variant-numeric: tabular-nums;
      visibility: hidden;
    }

    .ring-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(56px, 15vw, 72px);
      height: clamp(56px, 15vw, 72px);
      margin: clamp(1.5rem, 5vw, 2.5rem) 0;
    }

    .ring-outer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      animation: ring 2.4s ease-out infinite;
    }
    .ring-outer:nth-child(2) { animation-delay: 0.8s; }

    @keyframes ring {
      0% { transform: scale(1); opacity: 0.45; }
      100% { transform: scale(1.9); opacity: 0; }
    }

    #dial-tone {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      cursor: pointer;
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    #dial-tone.colgando {
      background: #cc0000;
      border-color: #cc0000;
    }

    #zona-botones {
      height: clamp(60px, 12vw, 72px);
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #tap-hint {
      font-size: clamp(10px, 2.5vw, 12px);
      letter-spacing: 0.15em;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.3);
      visibility: hidden;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    #autoria {
      position: fixed;
      bottom: 1.5rem;
      width: 100%;
      text-align: center;
      font-size: 9px;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.35);
    }

    .dots span {
      animation: blink 1.4s infinite;
      opacity: 0;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="centro">
    <div id="label">calling</div>
    <div id="name">Nature</div>

    <div id="zona-estado">
      <div id="connecting">connecting<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
      <div id="timer"></div>
    </div>

    <div class="ring-wrap">
      <div class="ring-outer"></div>
      <div class="ring-outer"></div>
      <div id="dial-tone">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </svg>
      </div>
    </div>

    <div id="zona-botones">
      <div id="tap-hint">tap to connect</div>

  </div>

  <script>
    const AUDIO_URL = "https://archive.org/download/ovejas-comprimidas/Ovejas%20comprimidas.mp3";
    const DURACION_TOTAL = 5872;
    const ORIGEN = new Date('2025-01-01T00:00:00Z').getTime();

    const connecting = document.getElementById('connecting');
    const hint = document.getElementById('tap-hint');
    const timer = document.getElementById('timer');
    const dialTone = document.getElementById('dial-tone');

    const audio = new Audio();
    audio.preload = 'none';

    let conectado = false;
    let timerInterval = null;
    let segundos = 0;
    let endedHandler = null;
    let tonandoOConectando = false;
    let lastTouch = 0;

    function getPuntoActual() {
      return (Date.now() - ORIGEN) / 1000 % DURACION_TOTAL;
    }

    function formatTime(s) {
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = (s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function iniciarTimer() {
      segundos = 0;
      timer.style.visibility = 'visible';
      timer.textContent = '00:00';
      timerInterval = setInterval(() => {
        segundos++;
        timer.textContent = formatTime(segundos);
      }, 1000);
    }

    function mostrarConectado() {
      connecting.innerHTML = 'connected';
      dialTone.classList.add('colgando');
      iniciarTimer();
    }

    function colgar() {
      if (endedHandler) {
        audio.removeEventListener('ended', endedHandler);
        endedHandler = null;
      }
      audio.pause();
      audio.src = '';
      clearInterval(timerInterval);
      conectado = false;
      tonandoOConectando = false;

      dialTone.classList.remove('colgando');
      connecting.style.visibility = 'hidden';
      timer.style.visibility = 'hidden';
      hint.style.visibility = 'visible';
      connecting.innerHTML = 'connecting<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
    }

    const tonoAudio = document.getElementById('tono-audio');

    function iniciarAudio() {
      conectado = true;
      audio.src = AUDIO_URL;

      endedHandler = () => {
        audio.currentTime = getPuntoActual();
        audio.play();
      };

      audio.addEventListener('canplay', () => {
        audio.currentTime = getPuntoActual();
        audio.play().then(() => {
          mostrarConectado();
          audio.addEventListener('ended', endedHandler);
        }).catch(() => {
          conectado = false;
          tonandoOConectando = false;
          connecting.style.visibility = 'hidden';
          hint.style.visibility = 'visible';
        });
      }, { once: true });

      audio.addEventListener('error', () => {
        conectado = false;
        tonandoOConectando = false;
        connecting.style.visibility = 'hidden';
        hint.style.visibility = 'visible';
      }, { once: true });

      audio.load();
    }

    function reproducirTonos(veces, callback) {
      let count = 0;

      function reproducirUno() {
        tonoAudio.currentTime = 0;
        tonoAudio.play().catch(() => {});
        count++;
        if (count < veces) {
          setTimeout(reproducirUno, 3000);
        } else {
          setTimeout(callback, 1100);
        }
      }

      reproducirUno();
    }

    function manejarInteraccion(e) {
      if (e.type === 'touchend') lastTouch = Date.now();
      if (e.type === 'click' && Date.now() - lastTouch < 500) return;

      if (e.target.closest('#dial-tone') && conectado) {
        colgar();
        return;
      }

      if (!conectado && !tonandoOConectando) {
        tonandoOConectando = true;
        hint.style.visibility = 'hidden';
        connecting.style.visibility = 'visible';

        // Precargamos el tono dentro del evento de usuario
        tonoAudio.load();

        const numTonos = Math.floor(Math.random() * 3) + 1;

        // Delay de 500ms antes del primer pitido
        setTimeout(() => {
          reproducirTonos(numTonos, () => {
            iniciarAudio();
          });
        }, 500);
      }
    }

    hint.style.visibility = 'visible';

    document.body.addEventListener('click', manejarInteraccion);
    document.body.addEventListener('touchend', manejarInteraccion);
  </script>
